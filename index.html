<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>College Schedule Assistant</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:#0b1020;color:#eef2ff;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:28px 18px}.card{background:#121a2e;border:1px solid #263354;border-radius:22px;box-shadow:0 20px 60px #0005;overflow:hidden}
.head{padding:30px;background:linear-gradient(135deg,#18264a,#11182c)}h1{margin:0 0 7px;font-size:28px}.sub{color:#aeb9d4}
.search{display:flex;gap:10px;padding:20px;border-bottom:1px solid #263354}.search input{flex:1;padding:15px 16px;border-radius:13px;border:1px solid #354263;background:#0d1426;color:white;font-size:16px;outline:none}.search button,.chip{border:0;border-radius:12px;padding:12px 16px;background:#6d7cff;color:white;font-weight:700;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 18px}.chip{background:#202c49;font-weight:600}.result{padding:0 20px 24px}.bubble{background:#0d1426;border:1px solid #293655;border-radius:16px;padding:18px;line-height:1.55}.title{font-weight:800;font-size:18px;margin-bottom:8px}.item{padding:13px 0;border-top:1px solid #263354}.muted{color:#9eabc7}.tag{display:inline-block;padding:4px 8px;border-radius:8px;background:#263453;font-size:12px;margin-right:6px}
footer{padding:18px 20px;color:#8190af;font-size:12px;border-top:1px solid #263354}.error{color:#ffb4b4}
</style></head><body><div class="wrap"><div class="card">
<div class="head"><h1>🤖 College Schedule Assistant</h1><div class="sub">Ask about your classes, rooms, teachers, dates or holidays.</div></div>
<div class="search"><input id="q" placeholder="Try: AI201 ka room kya hai? / Monday ka schedule"><button onclick="ask()">Ask</button></div>
<div class="chips"><button class="chip" onclick="quick('aaj')">Today</button><button class="chip" onclick="quick('kal')">Tomorrow</button><button class="chip" onclick="quick('Monday')">Monday</button><button class="chip" onclick="quick('AI201')">AI201</button><button class="chip" onclick="quick('MA201')">MA201</button><button class="chip" onclick="quick('DAA')">DAA</button></div>
<div class="result"><div id="out" class="bubble"><div class="title">Ready!</div>Ask me something about your schedule.</div></div>
<footer>Timetable entries are based on the AI1-marked entries from the academic planning document.</footer>
</div></div>
<script src="data.js"></script><script>
const D=window.APP_DATA, days=Object.keys(D.schedule), aliases={os:"AI201","os lab":"AI261",daa:"CS203","daa lab":"CS263",maths:"MA201","math":"MA201","technical writing":"HS201","signal":"AI203"};
function norm(s){s=s.toLowerCase().replace(/\s+/g," ").trim(); for(const [a,c] of Object.entries(aliases)) if(s.includes(a)) return c; const m=s.match(/\b(ai|ma|cs|hs|sc|ec)\s*(\d{3})\b/i); return m?(m[1]+m[2]).toUpperCase():null}
function fmtDate(d){return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function exception(ds){for(const e of D.exceptions){if(ds>=e[0]&&ds<=e[1]) return {type:e[2],name:e[3]}} return null}
function nextOcc(code){let now=new Date(), best=null; for(let i=0;i<14;i++){let d=new Date(now);d.setDate(now.getDate()+i);let list=D.schedule[days[d.getDay()-1]]||[]; if(d.getDay()==0||d.getDay()==6)continue; for(const x of list)if(x.course===code&&!exception(d.toISOString().slice(0,10))){best={d,x};break} if(best)break} return best}
function course(code){let c=D.courses[code]; if(!c)return null; let rows=[]; for(const day of days) for(const x of D.schedule[day])if(x.course===code)rows.push(`<div class="item"><b>${day}</b> · ${x.start}–${x.end}<br><span class="muted">Room ${x.room}</span></div>`); let n=nextOcc(code); return `<div class="title">${code} — ${c[0]}</div><div class="muted">Teacher: ${c[1]}</div>${rows.join("")||'<div class="item">No weekly occurrence is stored.</div>'}${n?`<div class="item"><span class="tag">Next</span>${fmtDate(n.d)} · ${n.x.start}–${n.x.end} · Room ${n.x.room}</div>`:""}`}
function dayDate(d){let ds=d.toISOString().slice(0,10), ex=exception(ds), day=days[d.getDay()-1]; let head=`<div class="title">${day||"Weekend"} · ${fmtDate(d)}</div>`; if(ex)return head+`<div class="item"><span class="tag">${ex.type}</span>${ex.name}</div>`; let list=D.schedule[day]||[]; return head+(list.length?list.map(x=>`<div class="item"><b>${x.start}–${x.end}</b> · ${x.course}<br>${x.name}<br><span class="muted">Room ${x.room}</span></div>`).join(""):'<div class="item">No classes scheduled.</div>')}
function parseDate(q){let now=new Date(); if(/\baaj\b|\btoday\b/.test(q))return now;if(/\bkal\b|\btomorrow\b/.test(q)) {let d=new Date(now);d.setDate(d.getDate()+1);return d}if(/\bparso\b|day after tomorrow/.test(q)){let d=new Date(now);d.setDate(d.getDate()+2);return d}let m=q.match(/\b(\d{1,2})[\/-](\d{1,2})\b/);if(m)return new Date(now.getFullYear(),+m[2]-1,+m[1]);m=q.match(/\b(\d{1,2})\s+(january|february|march|april|may|june|july|august|september|october|november|december)\b/i);if(m)return new Date(`${m[1]} ${m[2]} ${now.getFullYear()}`);let wd=days.findIndex(x=>q.includes(x.toLowerCase()));if(wd>=0){let d=new Date(now), target=wd+1, delta=(target-d.getDay()+7)%7;d.setDate(d.getDate()+delta);return d}return null}
function ask(){let q=document.getElementById("q").value.toLowerCase().trim();if(!q)return;let code=norm(q);let result=code&&D.courses[code]?course(code):null;if(!result){let d=parseDate(q);if(d)result=dayDate(d)}if(!result){let room=q.match(/\b(?:room|classroom)\s*(\d{4}[a-z]?)\b/i);if(room){let found=[];for(const day of days)for(const x of D.schedule[day])if(x.room.toLowerCase()===room[1].toLowerCase())found.push(`<div class="item"><b>${day}</b> · ${x.course} · ${x.start}–${x.end}</div>`);result=`<div class="title">Room ${room[1]}</div>`+(found.join("")||'<div class="item">No stored class found for this room.</div>')}}document.getElementById("out").innerHTML=result||`<div class="title">I couldn't match that.</div><div class="muted">Try “AI201”, “Monday ka schedule”, “kal”, “22/10”, or “AI201 ka teacher”.</div>`}
function quick(x){document.getElementById("q").value=x;ask()}document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")ask()});
</script></body></html>
